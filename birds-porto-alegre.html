<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      if (localStorage.getItem("darkMode") === "true") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
    <title>Aves de Porto Alegre</title>
    <link rel="icon" href="favicon.ico" />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="canonical" href="https://glauberramos.github.io/inat/birds-porto-alegre" />
    <meta name="description" content="Aves de Porto Alegre, com fotos e cantos." />
    <meta property="og:title" content="Aves de Porto Alegre" />
    <meta property="og:description" content="Aves de Porto Alegre, com fotos e cantos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://glauberramos.github.io/inat/birds-porto-alegre" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://glauberramos.github.io/inat/logo.png" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Glauber Ramos" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dark-mode.css?v=8" />
    <style>
      /* iOS-style grouped look: system colors, SF type scale, inset cards without shadows. */
      :root {
        --bg: #f2f2f7;
        --cell: #ffffff;
        --label: #000000;
        --label-2: rgba(60, 60, 67, 0.6);
        --label-3: rgba(60, 60, 67, 0.3);
        --separator: rgba(60, 60, 67, 0.2);
        --fill: rgba(120, 120, 128, 0.12);
        --tint: #4c8c00;
        --tint-pressed: #3f7500;
        --red: #d70015;
        --bar: rgba(242, 242, 247, 0.8);
      }
      html.dark-mode {
        --bg: #000000;
        --cell: #1c1c1e;
        --label: #ffffff;
        --label-2: rgba(235, 235, 245, 0.6);
        --label-3: rgba(235, 235, 245, 0.3);
        --separator: rgba(84, 84, 88, 0.65);
        --fill: rgba(118, 118, 128, 0.24);
        --tint: #5a9e0a;
        --tint-pressed: #4c8c00;
        --red: #ff6961;
        --bar: rgba(22, 22, 24, 0.8);
      }

      body.birds-page,
      html.dark-mode body.birds-page {
        background: var(--bg);
        color: var(--label);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 17px;
        line-height: 1.3;
        -webkit-font-smoothing: antialiased;
      }

      /* Compact title bar that appears once the large title scrolls away */
      .nav-bar {
        position: sticky;
        top: 0;
        z-index: 50;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        font-weight: 600;
        border-bottom: 0.5px solid transparent;
        transition: background-color 0.2s, border-color 0.2s;
      }
      .nav-bar span {
        opacity: 0;
        transition: opacity 0.2s;
      }
      .nav-bar.is-visible {
        background: var(--bar);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-bottom-color: var(--separator);
      }
      .nav-bar.is-visible span {
        opacity: 1;
      }

      .app {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 20px 48px;
      }
      .app-header {
        text-align: left;
        padding: 8px 4px 22px;
      }
      .app-header .large-title {
        font-size: 34px;
        line-height: 41px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--label);
        margin: 0;
      }
      .app-header .subtitle {
        font-size: 15px;
        color: var(--label-2);
        margin-top: 4px;
      }
      .header-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }
      .app-header .challenge-btn {
        width: auto; /* styles.css makes buttons full width on phones */
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 16px 8px 13px;
        border-radius: 999px;
        background: var(--tint);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
      }
      .app-header .challenge-btn:hover,
      .app-header .challenge-btn:active {
        background: var(--tint-pressed);
      }
      .app-header .challenge-btn:focus-visible {
        outline: 3px solid var(--tint);
        outline-offset: 2px;
      }
      .challenge-btn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }
      /* Family filter: a native menu dressed as a pill, with its own chevron */
      .family-filter {
        position: relative;
        min-width: 0;
        max-width: 100%;
      }
      .header-actions .family-filter select {
        -webkit-appearance: none;
        appearance: none;
        field-sizing: content; /* as wide as the chosen family, where supported */
        max-width: 100%;
        height: 100%;
        padding: 8px 34px 8px 14px;
        border: none;
        border-radius: 999px;
        background: var(--cell);
        color: var(--label);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .header-actions .family-filter select:focus-visible {
        outline: 3px solid var(--tint);
        outline-offset: 2px;
      }
      .family-filter::after {
        content: "";
        position: absolute;
        right: 15px;
        top: 50%;
        width: 7px;
        height: 7px;
        margin-top: -6px;
        border-right: 2px solid var(--label-2);
        border-bottom: 2px solid var(--label-2);
        transform: rotate(45deg);
        pointer-events: none;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      /* Three birds per row on desktop, two on tablets, one on phones */
      .birds {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      .bird {
        display: flex;
        flex-direction: column;
        background: var(--cell);
        border-radius: 22px;
        overflow: hidden;
      }
      .bird[hidden] {
        display: none; /* display: flex above would otherwise override [hidden], which the family filter uses */
      }
      /* Every card shows a 3:2 frame. Photos close to that fill it; any other shape (portraits, square
         or very wide shots) is shown whole, on a blurred copy of itself, so the bird is never cut off. */
      .bird-photo {
        position: relative;
        aspect-ratio: 3 / 2;
        overflow: hidden;
        background: var(--fill);
      }
      .bird-photo img {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .bird-photo.is-whole img {
        object-fit: contain;
      }
      .bird-photo.is-whole::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--photo) center / cover;
        filter: blur(24px) saturate(1.2) brightness(0.85);
        transform: scale(1.2); /* hides the blur's soft edge */
      }
      .bird-body {
        padding: 14px 16px 16px;
      }
      .bird .bird-name {
        font-size: 20px;
        line-height: 25px;
        font-weight: 600;
        color: var(--label);
      }
      .bird-sci {
        font-size: 15px;
        font-style: italic;
        color: var(--label-2);
      }
      /* The page is ordered by family; the label above the name shows which one */
      .bird-family {
        margin-bottom: 2px;
        font-size: 13px;
        font-weight: 600;
        color: var(--tint);
      }

      /* One recording: play button, name and time, then its spectrogram */
      .rec {
        margin-top: 14px;
      }
      .rec + .rec {
        padding-top: 14px;
        border-top: 0.5px solid var(--separator);
      }
      .rec-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .rec .play-btn {
        flex: none;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 50%;
        background: var(--tint);
        color: #fff;
        display: grid;
        place-items: center;
        transition: transform 0.12s, background-color 0.12s;
      }
      .rec .play-btn:hover {
        background: var(--tint);
      }
      .rec .play-btn:active {
        background: var(--tint-pressed);
        transform: scale(0.92);
      }
      .rec .play-btn:focus-visible {
        outline: 3px solid var(--tint);
        outline-offset: 2px;
      }
      .rec .play-btn:disabled {
        background: var(--label-3);
        cursor: default;
        transform: none;
      }
      .play-btn svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
      }
      .play-btn .icon-play {
        margin-left: 2px; /* optical centering of the triangle */
      }
      .play-btn .icon-pause,
      .rec.is-playing .play-btn .icon-play,
      .rec.is-loading .play-btn svg {
        display: none;
      }
      .rec.is-playing .play-btn .icon-pause {
        display: block;
      }
      .rec.is-loading .play-btn::after {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .rec-title {
        flex: 1;
        font-size: 17px;
        font-weight: 600;
      }
      .rec-time {
        font-size: 15px;
        color: var(--label-2);
        font-variant-numeric: tabular-nums;
      }
      .rec.is-playing .rec-time {
        color: var(--tint);
      }
      .rec.failed .rec-title,
      .rec.failed .rec-time {
        color: var(--label-2);
      }

      .spec {
        position: relative;
        height: 64px;
        border-radius: 10px;
        overflow: hidden;
        background: #000004;
        cursor: pointer;
      }
      .spec img {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Dims what hasn't played yet; its left edge is the playhead */
      .spec-progress {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        border-left: 2px solid #fff;
        pointer-events: none;
      }
      .rec-credit,
      html.dark-mode body .rec-credit {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: var(--label-2);
        line-height: 16px;
        text-decoration: none;
      }
      .rec-credit:hover {
        text-decoration: underline;
      }

      .credits {
        margin-top: 36px;
      }
      .credits summary {
        font-size: 13px;
        color: var(--label-2);
        cursor: pointer;
        padding: 0 4px 8px;
        list-style: none;
      }
      .credits summary::-webkit-details-marker {
        display: none;
      }
      .credits summary::after {
        content: "›";
        display: inline-block;
        margin-left: 6px;
        transition: transform 0.2s;
      }
      .credits[open] summary::after {
        transform: rotate(90deg);
      }
      .credits ul {
        list-style: none;
        background: var(--cell);
        border-radius: 12px;
        padding: 0 16px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--label-2);
      }
      .credits li {
        padding: 10px 0;
      }
      .credits li + li {
        border-top: 0.5px solid var(--separator);
      }
      .credits strong {
        color: var(--label);
        font-weight: 600;
      }
      .credits a,
      html.dark-mode body .credits a {
        color: inherit;
      }

      /* Challenge: a sheet with one mystery recording and four birds to pick from */
      .quiz {
        --sheet: var(--bg);
        --sheet-cell: var(--cell);
        margin: auto; /* styles.css zeroes every margin, which would pin the dialog to the corner */
        border: none;
        padding: 0;
        width: min(440px, calc(100% - 32px));
        max-width: none;
        max-height: calc(100% - 32px);
        border-radius: 20px;
        background: var(--sheet);
        color: var(--label);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      /* Like iOS, the sheet uses the raised grays in dark mode so it stands off the black page */
      html.dark-mode .quiz {
        --sheet: #1c1c1e;
        --sheet-cell: #2c2c2e;
      }
      .quiz::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      html.dark-mode .quiz::backdrop {
        background: rgba(0, 0, 0, 0.7);
      }
      .quiz[open] {
        animation: sheet-in 0.25s ease-out;
      }
      @keyframes sheet-in {
        from {
          opacity: 0;
          transform: translateY(32px);
        }
      }
      /* Score on the left, close on the right */
      .quiz-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 52px;
        padding: 0 16px 0 20px;
      }
      .quiz-score {
        display: flex;
        gap: 14px;
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .quiz-score .is-right {
        color: var(--tint);
      }
      .quiz-score .is-wrong {
        color: var(--red);
      }
      /* Zerar sits beside the score; it only shows once there's a score to clear */
      .quiz .quiz-reset {
        width: auto;
        margin-left: 12px;
        padding: 6px 0;
        background: transparent;
        color: var(--tint);
        font-size: 15px;
      }
      .quiz .quiz-reset:hover {
        background: transparent;
      }
      .quiz .quiz-reset[hidden] {
        display: none;
      }
      .quiz .quiz-close {
        margin-left: auto;
        width: auto;
        padding: 6px 0;
        background: transparent;
        color: var(--tint);
        font-size: 17px;
      }
      .quiz .quiz-close:hover {
        background: transparent;
      }
      .quiz-body {
        padding: 0 16px 20px;
      }
      .quiz .quiz-question {
        margin: 0 4px 12px;
        font-size: 26px;
        line-height: 32px;
        font-weight: 700;
        color: var(--label);
      }

      /* The mystery recording: a big play button beside its spectrogram, which stays
         covered until the answer (it would give the bird away) but still shows the playhead */
      .quiz-sound {
        background: var(--sheet-cell);
        border-radius: 16px;
        padding: 12px;
      }
      .quiz .quiz-rec {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 0;
      }
      .quiz-rec .play-btn {
        width: 56px;
        height: 56px;
      }
      .quiz-rec .play-btn svg {
        width: 22px;
        height: 22px;
      }
      .quiz-rec .spec {
        flex: 1;
        height: 56px;
      }
      .quiz-rec .spec img {
        transition: clip-path 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .quiz-rec .spec.is-concealed img {
        clip-path: inset(0 100% 0 0); /* uncovers left to right, along the time axis */
      }
      .quiz-rec .spec.is-concealed::before {
        content: "?";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.3);
      }
      .quiz-rec .rec-time,
      .quiz-rec.is-playing .rec-time {
        position: absolute;
        right: 6px;
        bottom: 6px;
        padding: 0 5px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6); /* stays legible over the spectrogram once uncovered */
        font-size: 12px;
        line-height: 18px;
        color: #fff;
        pointer-events: none;
      }

      .quiz-options {
        margin-top: 12px;
        border-radius: 16px;
        overflow: hidden;
      }
      .quiz .quiz-option {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 8px 14px 8px 8px;
        border-radius: 0;
        background: var(--sheet-cell);
        color: var(--label);
        font-size: 17px;
        text-align: left;
        transition: background-color 0.15s, opacity 0.15s;
      }
      .quiz .quiz-option + .quiz-option {
        border-top: 0.5px solid var(--separator);
      }
      .quiz .quiz-option:hover {
        background: var(--sheet-cell) linear-gradient(var(--fill), var(--fill));
      }
      .quiz .quiz-option:focus-visible {
        outline: 3px solid var(--tint);
        outline-offset: -3px;
      }
      .quiz .quiz-option:disabled {
        background: var(--sheet-cell);
        color: var(--label);
        cursor: default;
      }
      .quiz .quiz-option:disabled:not(.is-correct):not(.is-wrong) {
        opacity: 0.4;
      }
      .quiz .quiz-option.is-correct {
        background: color-mix(in srgb, var(--tint) 18%, var(--sheet-cell));
      }
      .quiz .quiz-option.is-wrong {
        background: color-mix(in srgb, var(--red) 16%, var(--sheet-cell));
      }
      .quiz-option img {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 10px;
        object-fit: cover;
        background: var(--fill);
      }
      .quiz-option-name {
        flex: 1;
        font-weight: 500;
      }
      .quiz-mark {
        flex: none;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        color: #fff;
        font-size: 13px;
        font-weight: 800;
      }
      .quiz-option.is-correct .quiz-mark {
        background: var(--tint);
      }
      .quiz-option.is-correct .quiz-mark::before {
        content: "✓";
      }
      .quiz-option.is-wrong .quiz-mark {
        background: var(--red);
      }
      .quiz-option.is-wrong .quiz-mark::before {
        content: "✕";
      }

      /* Hint or result on the left, Pular/Próxima on the right; always there, so nothing jumps */
      .quiz-footer {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 46px;
        margin-top: 16px;
      }
      .quiz-feedback {
        flex: 1;
        margin: 0 4px;
        font-size: 15px;
        line-height: 20px;
        color: var(--label-2);
      }
      .quiz-feedback.is-right,
      .quiz-feedback.is-wrong {
        font-size: 17px;
        line-height: 22px;
        font-weight: 600;
      }
      .quiz-feedback.is-right {
        color: var(--tint);
      }
      .quiz-feedback.is-wrong {
        color: var(--red);
      }
      .quiz .quiz-next {
        flex: none;
        width: auto;
        min-width: 112px;
        padding: 12px 22px;
        border-radius: 999px;
        background: var(--tint);
        color: #fff;
        font-size: 17px;
        font-weight: 600;
      }
      .quiz .quiz-next:hover,
      .quiz .quiz-next:active {
        background: var(--tint-pressed);
      }
      .quiz .quiz-next.is-skip {
        background: var(--fill);
        color: var(--tint);
      }
      .quiz .quiz-next.is-skip:hover,
      .quiz .quiz-next.is-skip:active {
        background: var(--fill) linear-gradient(var(--fill), var(--fill));
      }
      .quiz .quiz-next:focus-visible {
        outline: 3px solid var(--tint);
        outline-offset: 2px;
      }

      @media (max-width: 1000px) {
        .birds {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 640px) {
        .birds {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      /* Only the phone bottom sheet shows the grabber */
      .quiz-grabber {
        display: none;
      }
      @media (max-width: 480px) {
        .app {
          padding: 0 16px 40px;
        }
        /* Bottom sheet on phones; drag the grabber or the bar down to close it */
        .quiz {
          width: 100%;
          margin: auto 0 0;
          border-radius: 20px 20px 0 0;
          padding-bottom: env(safe-area-inset-bottom);
        }
        .quiz-grabber {
          display: block;
          width: 36px;
          height: 5px;
          margin: 6px auto 0;
          border-radius: 3px;
          background: var(--label-3);
        }
        .quiz-grabber,
        .quiz-bar {
          touch-action: none; /* the drag is ours, not a scroll */
        }
        .quiz-bar {
          height: 41px; /* the grabber takes the top 11px */
        }
        .quiz.is-settling {
          transition: transform 0.25s ease-out;
        }
        .app-header .large-title {
          font-size: 30px;
          line-height: 36px;
        }
        .birds {
          gap: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rec.is-loading .play-btn::after {
          animation-duration: 2.4s;
        }
        .nav-bar,
        .nav-bar span,
        .rec .play-btn,
        .quiz .quiz-option,
        .quiz-rec .spec img {
          transition: none;
        }
        .quiz[open] {
          animation: none;
        }
        .quiz.is-settling {
          transition: none;
        }
      }
    </style>
  </head>
  <body class="birds-page">
    <div class="nav-bar" id="navBar" aria-hidden="true"><span>Aves de Porto Alegre</span></div>

    <div class="app">
      <header class="app-header">
        <h1 class="large-title" id="largeTitle">Aves de Porto Alegre</h1>
        <p class="subtitle"><span id="speciesCount"></span>. Toque para ouvir o canto.</p>
        <div class="header-actions">
          <button class="challenge-btn" id="challengeBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 15v-3a8 8 0 0 1 16 0v3" />
              <rect x="3" y="14" width="4.5" height="7" rx="2" />
              <rect x="16.5" y="14" width="4.5" height="7" rx="2" />
            </svg>
            Desafio
          </button>
          <label class="family-filter">
            <span class="visually-hidden">Filtrar por família</span>
            <select id="familyFilter">
              <option value="">Todas as famílias</option>
            </select>
          </label>
        </div>
      </header>

      <main class="birds" id="birdsGrid"></main>

      <details class="credits">
        <summary>Créditos das fotos e sons</summary>
        <ul id="birdsCredits"></ul>
      </details>
    </div>

    <dialog class="quiz" id="quiz" aria-labelledby="quizTitle">
      <div class="quiz-grabber" aria-hidden="true"></div>
      <div class="quiz-bar">
        <p class="quiz-score" id="quizScore"></p>
        <button class="quiz-reset" id="quizReset" type="button" hidden>Zerar</button>
        <button class="quiz-close" id="quizClose" type="button">Fechar</button>
      </div>
      <div class="quiz-body">
        <h2 class="quiz-question" id="quizTitle">Que ave é essa?</h2>
        <div class="quiz-sound" id="quizSound"></div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-footer">
          <p class="quiz-feedback" id="quizFeedback" aria-live="polite"></p>
          <button class="quiz-next" id="quizNext" type="button"></button>
        </div>
      </div>
    </dialog>

    <script src="birds-porto-alegre-data.js"></script>
    <script>
      const LICENSES = {
        cc0: "CC0",
        "cc-by": "CC BY",
        "cc-by-nc": "CC BY-NC",
        "cc-by-sa": "CC BY-SA",
        "cc-by-nd": "CC BY-ND",
        "cc-by-nc-sa": "CC BY-NC-SA",
        "cc-by-nc-nd": "CC BY-NC-ND",
      };

      // Recording name per sound type; sounds without a type are songs.
      const SOUND_TYPES = { song: "Canto", call: "Chamado" };

      function soundKind(sound) {
        return SOUND_TYPES[sound.type] || SOUND_TYPES.song;
      }

      const PLAY_ICONS =
        '<svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.6v14.8a1.1 1.1 0 0 0 1.7.9l11.4-7.4a1.1 1.1 0 0 0 0-1.8L8.7 3.7A1.1 1.1 0 0 0 7 4.6z"/></svg>' +
        '<svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.3"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.3"/></svg>';

      function el(tag, attrs, children) {
        const node = document.createElement(tag);
        Object.entries(attrs || {}).forEach(([k, v]) => {
          if (k === "text") node.textContent = v;
          else node.setAttribute(k, v);
        });
        (children || []).forEach((c) => node.appendChild(c));
        return node;
      }

      // One shared player: starting a recording stops whatever was playing.
      const player = document.createElement("audio");
      player.preload = "none";
      let active = null; // recording row { sound, el, btn, spec, progress, time } currently loaded in the player

      // Grouped by family, families A-Z by their Portuguese name like the family filter; the sort
      // is stable, so birds keep the data file's order within a family.
      const BIRDS = BIRDS_PORTO_ALEGRE.slice().sort((a, b) => BIRD_FAMILIES[a.family].localeCompare(BIRD_FAMILIES[b.family], "pt"));

      function audioUrl(sound) {
        if (sound.source === "macaulay") {
          return `https://cdn.download.ams.birds.cornell.edu/api/v1/asset/${sound.ml}/audio`;
        }
        return sound.audio;
      }

      // Pre-rendered by scripts/bird-spectrograms.py
      function specUrl(sound) {
        const name = sound.source === "macaulay" ? `ml${sound.ml}` : sound.audio.split("/").pop().replace(/\.\w+$/, "");
        return `images/birds-porto-alegre/${name}.webp`;
      }

      // Recordings come from iNaturalist or the Macaulay Library (eBird/Merlin).
      function soundCredit(sound) {
        if (sound.source === "macaulay") {
          return {
            text: [sound.recordist, sound.location, `Macaulay Library ML${sound.ml}`].filter(Boolean).join(" · "),
            href: `https://macaulaylibrary.org/asset/${sound.ml}`,
          };
        }
        return {
          text: `${sound.recordist} · ${LICENSES[sound.license] || sound.license}`,
          href: `https://www.inaturalist.org/observations/${sound.observation}`,
        };
      }

      // m:ss
      function clock(seconds) {
        const s = Math.max(0, Math.floor(seconds));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }

      // The part of the recording that plays: start/end trim it, otherwise all of it.
      function span(sound) {
        const start = sound.start || 0;
        const end = Math.min(sound.end || Infinity, player.duration);
        return { start, len: end - start };
      }

      function setState(row, state) {
        row.el.classList.toggle("is-playing", state === "playing");
        row.el.classList.toggle("is-loading", state === "loading");
        row.btn.setAttribute("aria-label", `${state === "playing" ? "Pausar" : "Ouvir"} ${row.name}`);
      }

      function movePlayhead() {
        if (!active || !player.duration) return;
        const { start, len } = span(active.sound);
        const fraction = (player.currentTime - start) / len;
        if (fraction >= 1) {
          // Reached the end of a trimmed sound: stop as if the recording ended.
          player.pause();
          deactivate();
          return;
        }
        const played = Math.max(fraction, 0);
        active.progress.style.left = `${played * 100}%`;
        active.time.textContent = clock(played * len);
      }

      function tick() {
        movePlayhead();
        if (active && !player.paused) requestAnimationFrame(tick);
      }

      function deactivate() {
        if (!active) return;
        setState(active, "idle");
        active.progress.hidden = true;
        active.time.textContent = active.length;
        active = null;
      }

      player.addEventListener("playing", () => {
        if (!active) return;
        setState(active, "playing");
        active.progress.hidden = false;
        requestAnimationFrame(tick);
      });
      player.addEventListener("pause", () => {
        if (active && !active.el.classList.contains("is-loading")) setState(active, "idle");
      });
      player.addEventListener("seeked", movePlayhead);
      player.addEventListener("timeupdate", movePlayhead); // keeps trims working when rAF is throttled
      player.addEventListener("ended", deactivate);
      player.addEventListener("error", () => {
        if (!active) return;
        const row = active;
        deactivate();
        row.el.classList.add("failed");
        row.btn.disabled = true;
        row.time.textContent = "Indisponível";
      });

      function start(row, fraction) {
        player.pause();
        deactivate();
        active = row;
        row.progress.style.left = "0%";
        setState(row, "loading");
        const src = row.src;
        player.src = src;
        player.addEventListener(
          "loadedmetadata",
          () => {
            if (player.src !== src) return;
            const { start, len } = span(row.sound);
            if (start || fraction) player.currentTime = start + fraction * len;
          },
          { once: true }
        );
        player.play().catch(() => {});
      }

      function onButton(row) {
        if (active === row) {
          if (player.paused) player.play().catch(() => {});
          else player.pause();
        } else {
          start(row, 0);
        }
      }

      // Clicking the spectrogram jumps to that point of the recording.
      function onSpectrogram(row, event) {
        if (row.btn.disabled) return;
        const rect = row.spec.getBoundingClientRect();
        const fraction = Math.min(Math.max((event.clientX - rect.left) / rect.width, 0), 1);
        if (active === row && player.duration) {
          const { start, len } = span(row.sound);
          player.currentTime = start + fraction * len;
          if (player.paused) player.play().catch(() => {});
        } else {
          start(row, fraction);
        }
      }

      // Play button, time and spectrogram for one recording; the cards and the challenge both use it.
      function makeRow(sound, name, alt) {
        // Trimmed sounds know their length up front; others show it once played.
        const length = sound.end ? clock(sound.end - (sound.start || 0)) : "";
        const row = { sound, name, length, src: audioUrl(sound) };
        row.btn = el("button", { class: "play-btn", type: "button", "aria-label": `Ouvir ${name}` });
        row.btn.innerHTML = PLAY_ICONS;
        row.btn.addEventListener("click", () => onButton(row));
        row.time = el("span", { class: "rec-time", text: length });
        const img = el("img", { src: specUrl(sound), alt, loading: "lazy" });
        img.addEventListener("error", () => (img.style.visibility = "hidden"));
        row.progress = el("div", { class: "spec-progress" });
        row.progress.hidden = true;
        row.spec = el("div", { class: "spec", title: "Toque para ouvir a partir deste ponto" }, [img, row.progress]);
        row.spec.addEventListener("click", (e) => onSpectrogram(row, e));
        return row;
      }

      function renderSound(bird, sound, name) {
        const row = makeRow(sound, name, `Espectrograma: ${bird.name}, ${name.toLowerCase()}`);
        const credit = soundCredit(sound);
        row.el = el("div", { class: "rec" }, [
          el("div", { class: "rec-head" }, [row.btn, el("span", { class: "rec-title", text: name }), row.time]),
          row.spec,
          el("a", { class: "rec-credit", href: credit.href, target: "_blank", rel: "noopener", text: `Gravação: ${credit.text}` }),
        ]);
        return row.el;
      }

      function renderBird(bird) {
        // Numbered only when a bird has more than one of a kind: Canto, or Canto 1 and Canto 2.
        const kinds = bird.sounds.map(soundKind);
        const sounds = bird.sounds.map((s, j) => {
          const kind = kinds[j];
          const n = kinds.slice(0, j + 1).filter((k) => k === kind).length;
          const many = kinds.filter((k) => k === kind).length > 1;
          return renderSound(bird, s, many ? `${kind} ${n}` : kind);
        });

        return el("article", { class: "bird" }, [
          renderPhoto(bird),
          el("div", { class: "bird-body" }, [
            el("p", { class: "bird-family", text: BIRD_FAMILIES[bird.family] }),
            el("h2", { class: "bird-name", text: bird.name }),
            el("p", { class: "bird-sci", text: bird.scientificName }),
            ...sounds,
          ]),
        ]);
      }

      // How far a photo's shape can stray from the 3:2 frame and still fill it; a 4:3 photo would lose
      // a tenth of its height, enough to cut off a head or tail
      const PHOTO_FILL_MIN = 1.4;
      const PHOTO_FILL_MAX = 1.65;

      function renderPhoto(bird) {
        const img = el("img", { src: bird.photo, alt: bird.name, title: bird.photoCredit, loading: "lazy" });
        const frame = el("div", { class: "bird-photo" }, [img]);
        img.addEventListener("load", () => {
          const ratio = img.naturalWidth / img.naturalHeight;
          if (ratio >= PHOTO_FILL_MIN && ratio <= PHOTO_FILL_MAX) return;
          // Set only once loaded, so the backdrop reuses the cached photo instead of loading every one up front
          frame.style.setProperty("--photo", `url("${bird.photo}")`);
          frame.classList.add("is-whole");
        });
        return frame;
      }

      function renderCredits(bird) {
        const li = el("li");
        li.appendChild(el("strong", { text: `${bird.name}: ` }));
        li.appendChild(document.createTextNode(`foto ${bird.photoCredit}${bird.sounds.length ? "; cantos " : ""}`));
        bird.sounds.forEach((s, j) => {
          if (j) li.appendChild(document.createTextNode(", "));
          const credit = soundCredit(s);
          li.appendChild(el("a", { href: credit.href, target: "_blank", rel: "noopener", text: credit.text }));
        });
        return li;
      }

      const grid = document.getElementById("birdsGrid");
      const credits = document.getElementById("birdsCredits");
      const cards = BIRDS.map((bird) => {
        const card = renderBird(bird);
        grid.appendChild(card);
        credits.appendChild(renderCredits(bird));
        return { bird, card };
      });

      // Family filter: one option per family on the page, by its Portuguese name.
      const familyFilter = document.getElementById("familyFilter");
      [...new Set(BIRDS.map((b) => b.family))]
        .sort((a, b) => BIRD_FAMILIES[a].localeCompare(BIRD_FAMILIES[b], "pt"))
        .forEach((family) => familyFilter.appendChild(el("option", { value: family, text: `${BIRD_FAMILIES[family]} (${family})` })));
      // Species total in the subtitle; with a family picked, how many of the total are shown.
      const speciesCount = document.getElementById("speciesCount");
      function updateCount() {
        const shown = cards.filter(({ card }) => !card.hidden).length;
        const total = cards.length;
        speciesCount.textContent = shown === total ? `${total} espécies` : `${shown} de ${total} espécies`;
      }
      updateCount();

      familyFilter.addEventListener("change", () => {
        const family = familyFilter.value;
        cards.forEach(({ bird, card }) => (card.hidden = Boolean(family) && bird.family !== family));
        if (active && active.el.closest(".bird[hidden]")) stopPlayback();
        updateCount();
      });

      // Like an iOS navigation bar: the compact title shows once the large one scrolls under the bar.
      const navBar = document.getElementById("navBar");
      const largeTitle = document.getElementById("largeTitle");
      function updateNavBar() {
        navBar.classList.toggle("is-visible", largeTitle.getBoundingClientRect().bottom < navBar.offsetHeight);
      }
      window.addEventListener("scroll", updateNavBar, { passive: true });
      updateNavBar();

      // Challenge: guess the bird from its recording. Endless; the score lives in localStorage.
      const SCORE_KEY = "birdsPortoAlegreChallenge";
      // Birds still to come this lap, by iNat taxon id; every bird comes up once (with any one of
      // its sounds) before any repeats. The deck lives in memory and is saved to localStorage when
      // the browser allows, so a lap carries over between visits but still works where storage is
      // blocked (e.g. some browsers on file://), which used to reshuffle every round.
      const DECK_KEY = "birdsPortoAlegreChallengeDeck";
      const CHOICES = 4; // birds to pick from each round, the right one included
      const quiz = document.getElementById("quiz");
      const quizScore = document.getElementById("quizScore");
      const quizSound = document.getElementById("quizSound");
      const quizOptions = document.getElementById("quizOptions");
      const quizFeedback = document.getElementById("quizFeedback");
      const quizNext = document.getElementById("quizNext");
      const quizReset = document.getElementById("quizReset");
      let score = loadScore();
      let deck = loadDeck();
      let round = null; // { bird, row, correctBtn, answered }

      function loadScore() {
        try {
          const saved = JSON.parse(localStorage.getItem(SCORE_KEY));
          if (saved && Number.isFinite(saved.right) && Number.isFinite(saved.wrong)) return saved;
        } catch {}
        return { right: 0, wrong: 0 };
      }

      function saveScore() {
        try {
          localStorage.setItem(SCORE_KEY, JSON.stringify(score));
        } catch {}
      }

      // ✓ 3  ✕ 1, read out as "3 acertos, 1 erro"
      function renderScore() {
        const tally = (cls, glyph, n, word) =>
          el("span", { class: cls }, [
            el("span", { "aria-hidden": "true", text: `${glyph} ` }),
            document.createTextNode(n),
            el("span", { class: "visually-hidden", text: ` ${word}${n === 1 ? "" : "s"}` }),
          ]);
        quizScore.replaceChildren(tally("is-right", "✓", score.right, "acerto"), tally("is-wrong", "✕", score.wrong, "erro"));
        quizReset.hidden = score.right + score.wrong === 0;
      }

      function pickOne(list) {
        return list[Math.floor(Math.random() * list.length)];
      }

      function shuffle(list) {
        const out = list.slice();
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      function loadDeck() {
        try {
          const saved = JSON.parse(localStorage.getItem(DECK_KEY));
          if (Array.isArray(saved)) return saved;
        } catch {}
        return [];
      }

      // Next bird from the deck, reshuffled once it runs out (the bird just played doesn't open the new lap)
      function drawBird() {
        const playable = BIRDS.filter((b) => b.sounds.length);
        const byId = new Map(playable.map((b) => [b.inatTaxonId, b]));
        deck = deck.filter((id) => byId.has(id)); // drops birds no longer on the page
        if (!deck.length) {
          deck = shuffle(playable.map((b) => b.inatTaxonId));
          if (deck.length > 1 && round && deck[0] === round.bird.inatTaxonId) deck.push(deck.shift());
        }
        const bird = byId.get(deck.shift());
        try {
          localStorage.setItem(DECK_KEY, JSON.stringify(deck));
        } catch {}
        return bird;
      }

      function stopPlayback() {
        player.pause();
        deactivate();
      }

      function newRound() {
        stopPlayback();
        const bird = drawBird();
        const sound = pickOne(bird.sounds);
        // Wrong choices come from the same family first, which makes it harder; any left over are random
        const others = BIRDS.filter((b) => b !== bird);
        const sameFamily = shuffle(others.filter((b) => b.family === bird.family));
        const otherFamilies = shuffle(others.filter((b) => b.family !== bird.family));
        const choices = shuffle([bird, ...sameFamily.concat(otherFamilies).slice(0, CHOICES - 1)]);
        // The spectrogram would give the answer away, so it stays covered until answered
        const row = makeRow(sound, "a gravação", "Espectrograma da gravação");
        row.spec.classList.add("is-concealed");
        row.spec.appendChild(row.time);
        row.el = el("div", { class: "rec quiz-rec" }, [row.btn, row.spec]);
        quizSound.replaceChildren(row.el);
        round = { bird, row, answered: false };

        quizOptions.replaceChildren(
          ...choices.map((choice) => {
            const btn = el("button", { class: "quiz-option", type: "button" }, [
              el("img", { src: choice.photo, alt: "" }),
              el("span", { class: "quiz-option-name", text: choice.name }),
              el("span", { class: "quiz-mark", "aria-hidden": "true" }),
            ]);
            btn.addEventListener("click", () => answer(choice, btn));
            if (choice === bird) round.correctBtn = btn;
            return btn;
          })
        );
        quizFeedback.textContent = "Ouça e escolha uma ave.";
        quizFeedback.className = "quiz-feedback";
        // Skipping doesn't count; handy when a recording won't load
        quizNext.textContent = "Pular";
        quizNext.classList.add("is-skip");
        renderScore();
        row.btn.focus();
      }

      function answer(choice, btn) {
        if (round.answered) return;
        round.answered = true;
        const right = choice === round.bird;
        score[right ? "right" : "wrong"] += 1;
        saveScore();
        renderScore();

        quizOptions.querySelectorAll(".quiz-option").forEach((option) => (option.disabled = true));
        round.correctBtn.classList.add("is-correct");
        round.row.spec.classList.remove("is-concealed");
        if (!right) btn.classList.add("is-wrong");
        quizFeedback.textContent = right ? "Acertou!" : `Errou. A resposta é ${round.bird.name}.`;
        quizFeedback.classList.add(right ? "is-right" : "is-wrong");
        quizNext.textContent = "Próxima";
        quizNext.classList.remove("is-skip");
        quizNext.focus();
      }

      document.getElementById("challengeBtn").addEventListener("click", () => {
        quiz.showModal();
        newRound();
      });
      quizReset.addEventListener("click", () => {
        if (!confirm("Zerar o placar?")) return;
        score = { right: 0, wrong: 0 };
        saveScore();
        renderScore();
        quizNext.focus(); // the button hides itself, so keep focus in the sheet
      });
      document.getElementById("quizClose").addEventListener("click", () => quiz.close());
      quizNext.addEventListener("click", newRound);
      quiz.addEventListener("close", () => {
        stopPlayback();
        quiz.classList.remove("is-settling");
        quiz.style.transform = "";
      });

      // Swipe down to close the phone bottom sheet: drag from the grabber or the score bar.
      // Past a quarter of its height, or a quick flick, closes it; otherwise it springs back.
      const phoneSheet = window.matchMedia("(max-width: 480px)");
      let drag = null; // { y, t, dy }
      function startDrag(e) {
        if (!phoneSheet.matches || e.target.closest("button")) return;
        drag = { y: e.clientY, t: e.timeStamp, dy: 0 };
        quiz.classList.remove("is-settling");
        e.currentTarget.setPointerCapture(e.pointerId);
      }
      function moveDrag(e) {
        if (!drag) return;
        drag.dy = Math.max(0, e.clientY - drag.y);
        quiz.style.transform = `translateY(${drag.dy}px)`;
      }
      function endDrag(e) {
        if (!drag) return;
        const { dy, t } = drag;
        drag = null;
        const flick = dy > 20 && dy / Math.max(1, e.timeStamp - t) > 0.5; // px per ms
        quiz.classList.add("is-settling");
        if (dy > quiz.offsetHeight / 4 || flick) {
          quiz.style.transform = "translateY(100%)";
          setTimeout(() => quiz.close(), 250);
        } else {
          quiz.style.transform = "";
        }
      }
      for (const handle of [quiz.querySelector(".quiz-grabber"), quiz.querySelector(".quiz-bar")]) {
        handle.addEventListener("pointerdown", startDrag);
        handle.addEventListener("pointermove", moveDrag);
        handle.addEventListener("pointerup", endDrag);
        handle.addEventListener("pointercancel", endDrag);
      }
      // Tapping the dimmed backdrop closes the sheet. A press and release on different parts of the
      // sheet also reports the dialog as the target, so check the tap actually landed outside it.
      quiz.addEventListener("click", (e) => {
        if (e.target !== quiz) return;
        const r = quiz.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) quiz.close();
      });
    </script>
    <script defer data-domain="glauberramos.github.io/inat" src="https://plausible.io/js/script.js"></script>
    <script src="dark-mode.js?v=2"></script>
  </body>
