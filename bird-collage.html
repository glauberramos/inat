<html lang="en">
  <head>

    <meta property="og:title" content="Bird Collage - Your iNaturalist Birds as Stickers" />
    <meta
      property="og:description"

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Bird Collage",
        "description": "Turn the birds you've observed on iNaturalist into a sticker collage, sized by body mass, and download it as a high-resolution image.",

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="styles.css?v=4" />
    <link rel="stylesheet" href="dark-mode.css?v=8" />
    <style>
      .collage-form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        align-items: center;
        margin-bottom: 12px;
      }

      .collage-form .field {
        position: relative;
        flex: 1 1 180px;
        max-width: 260px;
      }

      .collage-form .field input {
        width: 100%;
      }

      .collage-form select {
        padding: 10px 12px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 1rem;
        background: white;
        color: inherit;
      }

      .collage-form .check {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.95rem;
        color: #555;
        white-space: nowrap;
      }

      .collage-form .check input {
        width: auto;
      }

      .date-fields {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #666;
      }

      .date-fields[hidden],
      .more-filters[hidden] {
        display: none;
      }

      .date-fields input {
        width: auto;
        padding: 8px 10px;
      }

      .more-button {
        background: white;
        color: #4a7d00;
        border: 2px solid #c9dba3;
        font-weight: 600;
      }

      .more-button:hover,
      .more-button[aria-expanded="true"] {
        background: #f3f7ea;
      }

      .more-filters {
        flex-basis: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(116, 172, 0, 0.06);
      }

      .more-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        justify-content: center;
        align-items: center;
      }

      .more-row label,
      .filter-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #555;
        font-size: 0.95rem;
      }

      .more-row select {
        padding: 6px 10px;
        font-size: 0.95rem;
      }

      .months {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        align-items: center;
      }

      #monthButtons {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
      }

      .month-btn {
        padding: 4px 9px;
        font-size: 0.85rem;
        background: white;
        color: #555;
        border: 1px solid #d6dccb;
        border-radius: 999px;
      }

      .month-btn:hover {
        background: #f3f7ea;
      }

      .month-btn[aria-pressed="true"] {
        background: #74ac00;
        border-color: #74ac00;
        color: white;
      }

      html.dark-mode body .more-button,
      html.dark-mode body .month-btn {
        background: #262626;
        border-color: #444;
        color: #ccc;
      }

      html.dark-mode body .month-btn[aria-pressed="true"] {
        background: #74ac00;
        border-color: #74ac00;
        color: white;
      }

      html.dark-mode body .more-row label,
      html.dark-mode body .filter-label,
      html.dark-mode body .date-fields {
        color: #bbb;
      }

      html.dark-mode body .more-row select {
        background: #2a2a2a;
        border-color: #444;
        color: #e0e0e0;
      }

      #makeButton {
        background: #74ac00;
        font-weight: 600;
      }

      #makeButton:hover {
        background: #5d8a00;
      }

      .autocomplete-list {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 2px solid #ddd;
        border-top: none;
        border-radius: 0 0 5px 5px;
        max-height: 260px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
        text-align: left;
      }

      .autocomplete-item {
        padding: 6px 12px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
      }

      .autocomplete-item:hover {
        background: #f3f7ea;
      }

      .autocomplete-name {
        font-weight: 500;
        color: #2c3e50;
      }

      .autocomplete-login {
        font-size: 0.8rem;
        color: #888;
      }

      .status {
        max-width: 560px;
        margin: 10px auto 0;
        text-align: center;
        color: #666;
        display: none;
      }

      .status .progress-bar {
        margin-top: 8px;
      }

      .error-message {
        display: none;
        max-width: 640px;
        margin: 10px auto;
        padding: 10px 14px;
        border-radius: 8px;
        background: #fdecea;
        color: #b3261e;
        text-align: center;
      }

      .collage-panel {
        display: none;
        margin-top: 16px;
      }

      .collage-stats {
        text-align: center;
        color: #555;
        font-size: 0.95rem;
        margin-bottom: 10px;
      }

      .collage-stats strong {
        color: #2c3e50;
      }

      .breadcrumb {
        text-align: center;
        font-size: 0.95rem;
        margin-bottom: 8px;
        color: #888;
      }

      .breadcrumb button {
        background: none;
        color: #4a7d00;
        padding: 0 2px;
        font-size: inherit;
        font-weight: 600;
      }

      .breadcrumb button:hover {
        background: none;
        text-decoration: underline;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-bottom: 12px;
      }

      .chip {
        background: white;
        color: #333;
        border: 1px solid #d6dccb;
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 0.88rem;
        line-height: 1.3;
      }

      .chip:hover {
        background: #f3f7ea;
        border-color: #74ac00;
      }

      .chip.active {
        background: #74ac00;
        border-color: #74ac00;
        color: white;
      }

      .chip .count {
        opacity: 0.6;
        margin-left: 4px;
        font-variant-numeric: tabular-nums;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        justify-content: center;
        align-items: center;
        margin-bottom: 12px;
        font-size: 0.92rem;
      }

      .toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #555;
        cursor: pointer;
      }

      .toolbar input[type="checkbox"] {
        width: auto;
      }

      .toolbar label:has(input:disabled) {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .toolbar select {
        padding: 6px 10px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 0.92rem;
        background: white;
        color: inherit;
      }

      /* The words on the image: blank keeps the automatic text, shown as the placeholder. */
      .text-fields {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        justify-content: center;
        margin-bottom: 12px;
        font-size: 0.92rem;
      }

      .text-fields label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1 1 180px;
        max-width: 260px;
        color: #555;
        font-size: 0.85rem;
        font-weight: 500;
      }

      .text-fields input {
        padding: 6px 10px;
        border: 2px solid #ddd;
        border-radius: 5px;
        font-size: 0.92rem;
        background: white;
        color: inherit;
      }

      .text-fields input:focus {
        outline: none;
        border-color: #74ac00;
      }

      #downloadButton {
        background: #2c3e50;
        font-weight: 600;
      }

      #downloadButton:hover {
        background: #1d2935;
      }

      #downloadButton:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .canvas-wrap {
        position: relative;
        margin: 0 auto;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.12);
      }

      .canvas-wrap {
        background: #ecebe4;
      }

      html.dark-mode body .canvas-wrap {
        background: #1d2023;
      }

      .canvas-wrap.is-dim #collageCanvas {
        opacity: 0.35;
        transition: opacity 0.2s;
      }

      .preview-loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 18px;
        pointer-events: none;
        z-index: 4;
      }

      .preview-loading[hidden] {
        display: none;
      }

      .canvas-wrap.is-dim .preview-loading {
        align-items: center;
        padding-top: 0;
      }

      .loading-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(20, 24, 18, 0.86);
        color: white;
        font-size: 0.92rem;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #9ccc3a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }

      #collageCanvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .tooltip {
        position: absolute;
        pointer-events: none;
        background: rgba(20, 24, 18, 0.92);
        color: white;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 0.85rem;
        line-height: 1.35;
        max-width: 260px;
        display: none;
        z-index: 5;
      }

      .tooltip em {
        opacity: 0.75;
      }

      .notes {
        max-width: 900px;
        margin: 14px auto 0;
        font-size: 0.85rem;
        color: #777;
        text-align: center;
      }

      .notes details {
        margin-top: 6px;
      }

      .notes summary {
        cursor: pointer;
      }

      .notes a {
        color: #4a7d00;
      }

      html.dark-mode body .collage-form select,
      html.dark-mode body .toolbar select,
      html.dark-mode body .text-fields input {
        background: #2a2a2a;
        border-color: #444;
        color: #e0e0e0;
      }

      html.dark-mode body .collage-form .check,
      html.dark-mode body .toolbar label,
      html.dark-mode body .text-fields label,
      html.dark-mode body .collage-stats,
      html.dark-mode body .status {
        color: #bbb;
      }

      html.dark-mode body .collage-stats strong {
        color: #eee;
      }

      html.dark-mode body .autocomplete-list {
        background: #2a2a2a;
        border-color: #444;
      }

      html.dark-mode body .autocomplete-item {
        border-color: #3a3a3a;
      }

      html.dark-mode body .autocomplete-item:hover {
        background: #333;
      }

      html.dark-mode body .autocomplete-name {
        color: #eee;
      }

      html.dark-mode body .chip {
        background: #262626;
        border-color: #444;
        color: #ddd;
      }

      html.dark-mode body .chip.active {
        background: #74ac00;
        border-color: #74ac00;
        color: white;
      }

      html.dark-mode body .breadcrumb button,
      html.dark-mode body .notes a {
        color: #9ccc3a;
      }

      html.dark-mode body .error-message {
        background: #3a1f1d;
        color: #f2b8b5;
      }

      .feedback-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #74ac00;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 999;
      }

      .feedback-button:hover {
        background: #5d8a00;
      }

      @media (max-width: 600px) {
        body {
          padding-top: 50px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .collage-form .field {
          max-width: none;
          flex-basis: 100%;
        }

        .canvas-wrap {
          border-radius: 8px;
        }

        .text-fields label {
          max-width: none;
          flex-basis: 100%;
        }
      }
    </style>
    <script src="analytics.js"></script>
  </head>
  <body>
    <a
      href="/inat"
      class="back-button"
      style="
        position: absolute;
        top: 16px;
        left: 16px;
        background: #2d2d2d;
        color: #ccc;
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 500;
        padding: 4px 10px;
        border-radius: 6px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      "
    >
      <span style="font-size: 1rem">←</span> More tools
    </a>
    <div class="container">
      <header>
        <div class="header-content">
          <div class="title-container">
            <img src="logo.png" alt="iNaturalist Tools logo" class="logo" />
            <h1>Bird Collage</h1>
          </div>
          <p class="description">
            Every bird you've observed on iNaturalist as a sticker, sized by body mass. Filter it and download it
            in high resolution.
          </p>
        </div>

        <form class="collage-form" id="collageForm" autocomplete="off">
          <div class="field">
            <input type="text" id="usernameInput" placeholder="iNaturalist username" data-1p-ignore />
            <div id="usernameAutocomplete" class="autocomplete-list"></div>
          </div>
          <div class="field">
            <input type="text" id="placeInput" placeholder="Place or project (any)" />
            <div id="placeAutocomplete" class="username-autocomplete"></div>
            <input type="hidden" id="placeIdInput" />
            <input type="hidden" id="projectIdInput" />
          </div>
          <div class="field">
            <input type="text" id="taxonInput" placeholder="Bird group (all birds)" />
            <div id="taxonAutocomplete" class="autocomplete-list"></div>
            <input type="hidden" id="taxonIdInput" />
          </div>
          <select id="whenSelect" title="When you saw them">
            <option value="all">All time</option>
            <option value="30d">Last 30 days</option>
            <option value="3m">Last 3 months</option>
            <option value="12m">Last 12 months</option>
            <option value="custom">Custom dates…</option>
          </select>
          <span class="date-fields" id="dateFields" hidden>
            <input type="date" id="dateFromInput" title="From" aria-label="From" />
            <span>to</span>
            <input type="date" id="dateToInput" title="To" aria-label="To" />
          </span>
          <select id="languageSelect" title="Language for common names">
            <option value="en" selected>English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="pt-BR">Portuguese (Brazil)</option>
            <option value="pt">Portuguese (Portugal)</option>
            <option value="it">Italian</option>
            <option value="nl">Dutch</option>
            <option value="ru">Russian</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
          </select>
          <button type="button" id="moreFiltersButton" class="more-button" aria-expanded="false">More filters</button>
          <button type="submit" id="makeButton">Make collage</button>
          <div class="more-filters" id="moreFilters" hidden>
            <div class="months" role="group" aria-label="Months">
              <span class="filter-label">Months</span>
              <span id="monthButtons"></span>
            </div>
            <div class="more-row">
              <label>
                Evidence
                <select id="evidenceSelect">
                  <option value="">Any</option>
                  <option value="photos">With photos</option>
                  <option value="sounds">With sounds (heard birds)</option>
                </select>
              </label>
              <label>
                Quality
                <select id="qualitySelect">
                  <option value="">Any</option>
                  <option value="verifiable">Verifiable</option>
                  <option value="research">Research grade</option>
                </select>
              </label>
              <label title="Native, endemic or introduced where it was observed">
                Status
                <select id="establishmentSelect">
                  <option value="">Any</option>
                  <option value="native">Native</option>
                  <option value="endemic">Endemic</option>
                  <option value="introduced">Introduced</option>
                </select>
              </label>
              <label class="check" title="Leave out captive and cultivated observations">
                <input type="checkbox" id="wildCheckbox" checked /> Wild only
              </label>
            </div>
          </div>
        </form>

        <div class="error-message" id="errorMessage"></div>
        <div class="status" id="status">
          <div id="statusText"></div>
          <div class="progress-bar"><div class="progress" id="statusProgress"></div></div>
        </div>
      </header>

      <main class="collage-panel" id="collagePanel">
        <div class="collage-stats" id="collageStats"></div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="chips" id="chips"></div>
        <div class="toolbar">
          <label title="Sticker length follows the cube root of body mass, so a bird 8× heavier is drawn 2× longer">
            <input type="checkbox" id="trueSizeCheckbox" /> True size
          </label>
          <label title="Vulnerable, Endangered and Critically Endangered (IUCN, via BirdLife)">
            <input type="checkbox" id="threatenedCheckbox" /> Threatened only
          </label>
          <label id="lifersLabel">
            <input type="checkbox" id="lifersCheckbox" /> Lifers only
          </label>
          <label>
            <input type="checkbox" id="darkCheckbox" /> Dark background
          </label>
          <label>
            Format
            <select id="formatSelect">
              <option value="wide">Wallpaper · 16:9</option>
              <option value="post">Instagram post · 4:5</option>
              <option value="story">Instagram story · 9:16</option>
              <option value="square">Square post · 1:1</option>
            </select>
          </label>
          <label title="Instagram shows images 1080 px wide; the larger sizes are sharper for printing and big screens">
            Size
            <select id="sizeSelect"></select>
          </label>
          <button type="button" id="downloadButton">⬇ Download PNG</button>
        </div>
        <div class="text-fields" title="Change the words on the image; leave a field blank for the automatic text">
          <label>
            Name
            <input type="text" id="whoInput" maxlength="40" autocomplete="off" />
          </label>
          <label>
            After the number
            <input type="text" id="whatInput" maxlength="60" autocomplete="off" />
          </label>
          <label>
            Place
            <input type="text" id="whereInput" maxlength="80" autocomplete="off" />
          </label>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="collageCanvas"></canvas>
          <div class="tooltip" id="tooltip"></div>
          <div class="preview-loading" id="previewLoading" role="status" aria-live="polite" hidden>
            <span class="loading-pill"><span class="spinner" aria-hidden="true"></span><span id="previewLoadingText"></span></span>
          </div>
        </div>
        <div class="notes" id="notes"></div>
      </main>
    </div>

    <script src="constants.js"></script>
    <script src="shared-utils.js?v=8"></script>
    <script src="autocomplete.js"></script>
    <script src="location-autocomplete.js?v=2"></script>
    <script src="bird-stickers-data.js?v=1"></script>
    <script src="bird-collage.js?v=3"></script>
    <script>
      const STICKER_INDEX = buildStickerIndex(BIRD_STICKERS);
      const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif';
      // Layout units: the collage is laid out at this width, whatever it is drawn at.
      const LAYOUT_WIDTH = 1600;
      // Each format at 1×: Instagram's own sizes, and Full HD for the wallpaper.
      // safe: share of the height kept clear at the top and bottom, where
      // Instagram draws its own buttons over a story.
      const FORMATS = {
        wide: { width: 1920, height: 1080, name: "wallpaper", sizes: ["Full HD", "4K", "6K"] },
        post: { width: 1080, height: 1350, name: "instagram-post", sizes: ["Instagram"] },
        story: { width: 1080, height: 1920, name: "instagram-story", sizes: ["Instagram"], safe: 0.1 },
        square: { width: 1080, height: 1080, name: "square", sizes: ["Instagram"] },
      };
      const SIZE_SCALES = [1, 2, 3];
      const THEMES = {
        light: { background: "#f7f5ef", ink: "#1f2a17", soft: "#6b7263", accent: "#5d8a00" },
        dark: { background: "#14171a", ink: "#f2f4ee", soft: "#9aa194", accent: "#9ccc3a" },
      };
      const MASK_SIZE = 96; // long side of each sticker's alpha mask, in pixels

      const els = {
        form: document.getElementById("collageForm"),
        username: document.getElementById("usernameInput"),
        usernameList: document.getElementById("usernameAutocomplete"),
        place: document.getElementById("placeInput"),
        placeList: document.getElementById("placeAutocomplete"),
        placeId: document.getElementById("placeIdInput"),
        taxon: document.getElementById("taxonInput"),
        taxonList: document.getElementById("taxonAutocomplete"),
        taxonId: document.getElementById("taxonIdInput"),
        projectId: document.getElementById("projectIdInput"),
        when: document.getElementById("whenSelect"),
        dateFields: document.getElementById("dateFields"),
        dateFrom: document.getElementById("dateFromInput"),
        dateTo: document.getElementById("dateToInput"),
        moreButton: document.getElementById("moreFiltersButton"),
        moreFilters: document.getElementById("moreFilters"),
        monthButtons: document.getElementById("monthButtons"),
        evidence: document.getElementById("evidenceSelect"),
        quality: document.getElementById("qualitySelect"),
        establishment: document.getElementById("establishmentSelect"),
        language: document.getElementById("languageSelect"),
        wild: document.getElementById("wildCheckbox"),
        make: document.getElementById("makeButton"),
        error: document.getElementById("errorMessage"),
        status: document.getElementById("status"),
        statusText: document.getElementById("statusText"),
        statusProgress: document.getElementById("statusProgress"),
        panel: document.getElementById("collagePanel"),
        stats: document.getElementById("collageStats"),
        breadcrumb: document.getElementById("breadcrumb"),
        chips: document.getElementById("chips"),
        trueSize: document.getElementById("trueSizeCheckbox"),
        threatened: document.getElementById("threatenedCheckbox"),
        lifers: document.getElementById("lifersCheckbox"),
        lifersLabel: document.getElementById("lifersLabel"),
        dark: document.getElementById("darkCheckbox"),
        format: document.getElementById("formatSelect"),
        size: document.getElementById("sizeSelect"),
        who: document.getElementById("whoInput"),
        what: document.getElementById("whatInput"),
        where: document.getElementById("whereInput"),
        download: document.getElementById("downloadButton"),
        wrap: document.getElementById("canvasWrap"),
        canvas: document.getElementById("collageCanvas"),
        tooltip: document.getElementById("tooltip"),
        previewLoading: document.getElementById("previewLoading"),
        previewLoadingText: document.getElementById("previewLoadingText"),
        notes: document.getElementById("notes"),
      };

      // ===== State =====

      const state = {
        query: null, // what the birds were loaded for: names and labels of its filters
        birds: [], // [{ taxonId, name, common, sticker, observations }]
        unmatched: [], // iNaturalist species without a sticker
        order: null,
        family: null,
        layout: null, // { key, width, height, placements, birdsByKey, reserve, lines }
        renderToken: 0,
      };

      // Downloaded sticker files and their masks, by file stem. Kept for the
      // whole visit so filtering and reshaping never download twice.
      const stickerFiles = new Map(); // stem -> Promise<{ blob, aspect, opaque, mask }>
      // Stickers decoded at the size they are drawn on screen.
      let screenBitmaps = new Map(); // "stem@WxH" -> ImageBitmap

      function readPref(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch {
          return fallback;
        }
      }

      function writePref(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // storage blocked: the setting just isn't remembered
        }
      }

      // ===== Status =====

      function setStatus(text, percent) {
        els.status.style.display = text ? "block" : "none";
        els.statusText.textContent = text || "";
        els.statusProgress.style.width = `${Math.max(0, Math.min(100, percent || 0))}%`;
      }

      function setError(message) {
        els.error.textContent = message || "";
        els.error.style.display = message ? "block" : "none";
      }

      // ===== Date range & months =====

      // Years back to iNaturalist's start, after the rolling ranges.
      for (let year = new Date().getFullYear(); year >= 2008; year--) {
        els.when.querySelector('option[value="custom"]').insertAdjacentHTML(
          "beforebegin",
          `<option value="y${year}">${year}</option>`
        );
      }

      function formatDay(value) {
        const [y, m, d] = value.split("-").map(Number);
        return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
      }

      // The chosen time span as API params and a label for the collage:
      // { year } or { d1, d2 } (shared-utils resolveDateRange), plus label.
      function readWhen() {
        const value = els.when.value;
        if (value.startsWith("y")) return { year: value.slice(1), label: value.slice(1) };
        if (value === "custom") {
          const from = els.dateFrom.value;
          const to = els.dateTo.value;
          if (from && to && from > to) return { error: "The start date is after the end date." };
          let label = "";
          if (from && to) label = `${formatDay(from)} – ${formatDay(to)}`;
          else if (from) label = `Since ${formatDay(from)}`;
          else if (to) label = `Until ${formatDay(to)}`;
          return { ...resolveDateRange("custom", from, to), label };
        }
        const label = value === "all" ? "" : els.when.selectedOptions[0].textContent;
        return { ...resolveDateRange(value), label };
      }

      els.monthButtons.innerHTML = MONTH_NAMES.map(
        (name, i) => `<button type="button" class="month-btn" data-month="${i + 1}" aria-pressed="false">${name}</button>`
      ).join("");

      function selectedMonths() {
        return Array.from(els.monthButtons.querySelectorAll('[aria-pressed="true"]')).map((b) => Number(b.dataset.month));
      }

      // "More filters (2)": how many of the extra filters are set.
      function updateMoreButton() {
        const active =
          (selectedMonths().length ? 1 : 0) +
          [els.evidence, els.quality, els.establishment].filter((select) => select.value).length +
          (els.wild.checked ? 0 : 1);
        els.moreButton.textContent = active ? `More filters (${active})` : "More filters";
      }

      els.monthButtons.addEventListener("click", (event) => {
        const button = event.target.closest(".month-btn");
        if (!button) return;
        button.setAttribute("aria-pressed", button.getAttribute("aria-pressed") === "true" ? "false" : "true");
        updateMoreButton();
      });
      [els.evidence, els.quality, els.establishment, els.wild].forEach((input) =>
        input.addEventListener("change", updateMoreButton)
      );
      els.moreButton.addEventListener("click", () => {
        const open = els.moreFilters.hidden;
        els.moreFilters.hidden = !open;
        els.moreButton.setAttribute("aria-expanded", String(open));
      });
      els.when.addEventListener("change", () => {
        els.dateFields.hidden = els.when.value !== "custom";
      });

      // ===== Loading birds =====

      async function loadBirds() {
        const username = els.username.value.trim();
        if (!username) {
          setError("Enter your iNaturalist username.");
          els.username.focus();
          return;
        }
        setError("");
        saveUsername(username);
        updateUrlWithUsername(username);

        let placeId = els.placeId.value;
        const projectId = els.projectId.value;
        const placeName = els.place.value.trim();
        if (placeName && !placeId && !projectId) {
          placeId = await resolvePlaceIdByName(placeName).catch(() => null);
          if (!placeId) {
            setError(`No place called "${placeName}". Pick one from the list.`);
            return;
          }
          els.placeId.value = placeId;
        }
        if (!placeName) els.placeId.value = els.projectId.value = placeId = "";
        const taxonId = els.taxon.value.trim() ? els.taxonId.value : "";
        const language = els.language.value;
        const when = readWhen();
        if (when.error) {
          setError(when.error);
          return;
        }
        const months = selectedMonths();
        const filters = {
          username,
          taxonId,
          placeId: projectId ? "" : placeId,
          projectId: placeName ? projectId : "",
          year: when.year,
          d1: when.d1,
          d2: when.d2,
          months,
          evidence: els.evidence.value,
          quality: els.quality.value,
          establishment: els.establishment.value,
          wild: els.wild.checked,
        };
        const url =
          `${API_BASE}/observations/species_counts?${collageQueryParams(filters)}` + commonNameParams(language);

        els.make.disabled = true;
        setStatus("Finding your birds…", 5);
        try {
          const results = await fetchSpeciesCountPages(url, {
            perPage: 500,
            delayMs: 1000,
            onPage: (page, pages) => setStatus(`Finding your birds… page ${page} of ${pages}`, (page / pages) * 20),
          });
          const birds = [];
          const unmatched = [];
          const seen = new Map();
          for (const result of results) {
            const taxon = result.taxon;
            if (!taxon || taxon.rank !== "species") continue;
            const sticker = matchSticker(STICKER_INDEX, taxon.name);
            const bird = {
              taxonId: taxon.id,
              name: taxon.name,
              common: taxon.preferred_common_name || "",
              observations: result.count || 0,
              globalObservations: taxon.observations_count || 0,
              sticker,
            };
            if (!sticker) {
              unmatched.push(bird);
            } else if (seen.has(sticker.stem)) {
              // Two iNaturalist species, one sticker (a lump): one bird.
              seen.get(sticker.stem).observations += bird.observations;
            } else {
              seen.set(sticker.stem, bird);
              birds.push(bird);
            }
          }
          if (!birds.length && !unmatched.length) {
            setStatus("");
            setError(`No bird species found for ${username} with these filters.`);
            els.panel.style.display = "none";
            return;
          }

          els.panel.style.display = "block";
          const format = currentFormat();
          sizeWrap(format.width / format.height);
          setPreviewLoading("Loading stickers…", { dim: true });
          await loadStickerFiles(
            birds.map((bird) => bird.sticker),
            (done, total) => {
              setStatus(`Loading high-resolution stickers… ${done} of ${total}`, 20 + (done / total) * 80);
              els.previewLoadingText.textContent = `Loading high-resolution stickers… ${done} / ${total}`;
            }
          );
          setStatus("");

          state.query = {
            username,
            placeName: placeId || projectId ? placeName : "",
            taxonName: taxonId ? els.taxon.value.trim() : "",
            whenLabel: when.label,
            monthsLabel: monthsLabel(months),
            evidence: filters.evidence,
            quality: filters.quality,
            establishment: filters.establishment,
            liferStart: periodStart(filters),
            wild: filters.wild,
            prior: null, // stems of the birds seen before liferStart, once fetched
          };
          state.birds = birds.filter((bird) => stickerFiles.get(bird.sticker.stem).ready);
          state.unmatched = unmatched.concat(birds.filter((bird) => !stickerFiles.get(bird.sticker.stem).ready));
          state.order = null;
          state.family = null;
          els.panel.style.display = "block";
          syncLifersToggle();
          applyLifers();
        } catch (error) {
          setStatus("");
          clearPreviewLoading();
          if (!state.birds.length) els.panel.style.display = "none";
          setError(
            /HTTP 422/.test(error.message)
              ? `There's no iNaturalist user called "${username}".`
              : `Couldn't load your birds: ${error.message}`
          );
        } finally {
          els.make.disabled = false;
        }
      }

      // Download each sticker once, and read its shape: aspect ratio, how much
      // of its box the bird covers, and a small alpha mask for packing.
      async function loadStickerFiles(stickers, onProgress) {
        const pending = stickers.filter((sticker) => !stickerFiles.has(sticker.stem));
        for (const sticker of stickers) {
          if (!stickerFiles.has(sticker.stem)) stickerFiles.set(sticker.stem, { ready: false });
        }
        let done = stickers.length - pending.length;
        onProgress(done, stickers.length);
        let next = 0;
        async function worker() {
          while (next < pending.length) {
            const sticker = pending[next++];
            try {
              stickerFiles.set(sticker.stem, await readSticker(sticker));
            } catch (error) {
              console.warn("Sticker failed", sticker.stem, error);
              stickerFiles.delete(sticker.stem);
            }
            done++;
            onProgress(done, stickers.length);
          }
        }
        await Promise.all(Array.from({ length: 8 }, worker));
        for (const sticker of stickers) {
          if (!stickerFiles.has(sticker.stem)) stickerFiles.set(sticker.stem, { ready: false });
        }
      }

      async function readSticker(sticker) {
        let blob = null;
        for (const url of stickerUrls(sticker, STICKER_INDEX.tag)) {
          try {
            const response = await fetch(url, { mode: "cors" });
            if (response.ok) {
              blob = await response.blob();
              break;
            }
          } catch {
            // try the next mirror
          }
        }
        if (!blob) throw new Error("not found");
        const bitmap = await createImageBitmap(blob);
        const aspect = bitmap.width / bitmap.height;
        const mw = aspect >= 1 ? MASK_SIZE : Math.max(1, Math.round(MASK_SIZE * aspect));
        const mh = aspect >= 1 ? Math.max(1, Math.round(MASK_SIZE / aspect)) : MASK_SIZE;
        const canvas = document.createElement("canvas");
        canvas.width = mw;
        canvas.height = mh;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(bitmap, 0, 0, mw, mh);
        bitmap.close();
        const pixels = ctx.getImageData(0, 0, mw, mh).data;
        const data = new Uint8Array(mw * mh);
        let covered = 0;
        for (let i = 0; i < data.length; i++) {
          if (pixels[i * 4 + 3] > 40) {
            data[i] = 1;
            covered++;
          }
        }
        return { ready: true, blob, aspect, opaque: covered / data.length || 0.5, mask: { width: mw, height: mh, data } };
      }

      // ===== Filters =====

      function orderLabel(order) {
        return BIRD_ORDER_NAMES[order] || order;
      }

      // Lifers only is on and the earlier birds are known.
      function lifersActive() {
        return els.lifers.checked && !!(state.query && state.query.prior);
      }

      function isLifer(bird) {
        return !state.query.prior.has(bird.sticker.stem);
      }

      // The toolbar's filters (threatened, lifers), before the order and family chips.
      function passesToggles(bird) {
        return (
          (!els.threatened.checked || THREATENED_IUCN.includes(bird.sticker.iucn)) &&
          (!lifersActive() || isLifer(bird))
        );
      }

      function filteredBirds() {
        return state.birds.filter(
          (bird) =>
            (!state.order || bird.sticker.order === state.order) &&
            (!state.family || bird.sticker.family === state.family) &&
            passesToggles(bird)
        );
      }

      function plural(count, one, many) {
        return `${count.toLocaleString()} ${count === 1 ? one : many}`;
      }

      function countBy(birds, key) {
        const counts = new Map();
        for (const bird of birds) counts.set(bird.sticker[key], (counts.get(bird.sticker[key]) || 0) + 1);
        return counts;
      }

      function renderFilters() {
        const pool = state.birds.filter(passesToggles);
        const visible = filteredBirds();
        const orders = countBy(pool, "order");
        const families = countBy(pool, "family");
        const threatened = state.birds.filter((bird) => THREATENED_IUCN.includes(bird.sticker.iucn)).length;

        const parts = [
          `<strong>${visible.length.toLocaleString()}</strong> of ${state.birds.length.toLocaleString()} species`,
          plural(countBy(visible, "order").size, "order", "orders"),
          plural(countBy(visible, "family").size, "family", "families"),
        ];
        if (threatened) parts.push(`${threatened} threatened`);
        if (state.query.prior) parts.push(plural(state.birds.filter(isLifer).length, "lifer", "lifers"));
        els.stats.innerHTML = parts.join(" · ");

        const crumbs = [`<button type="button" data-crumb="all">All birds</button>`];
        if (state.order) {
          crumbs.push(
            state.family
              ? `<button type="button" data-crumb="order">${escapeHtml(orderLabel(state.order))}</button>`
              : `<span>${escapeHtml(orderLabel(state.order))}</span>`
          );
        }
        if (state.family) crumbs.push(`<span>${escapeHtml(familyLabel(state.family))}</span>`);
        els.breadcrumb.innerHTML = crumbs.join(" / ");

        let chips;
        if (!state.order) {
          chips = Array.from(orders.entries()).map(([order, count]) => ({
            kind: "order",
            value: order,
            label: orderLabel(order),
            title: order,
            count,
          }));
        } else {
          chips = Array.from(families.entries())
            .filter(([family]) => pool.some((b) => b.sticker.family === family && b.sticker.order === state.order))
            .map(([family, count]) => ({
              kind: "family",
              value: family,
              label: familyLabel(family),
              title: family,
              count,
            }));
        }
        chips.sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
        els.chips.innerHTML = chips
          .map(
            (chip) =>
              `<button type="button" class="chip${chip.value === state.family ? " active" : ""}" data-kind="${chip.kind}" data-value="${escapeHtml(chip.value)}" title="${escapeHtml(chip.title)}">${escapeHtml(chip.label)}<span class="count">${chip.count}</span></button>`
          )
          .join("");
      }

      function familyLabel(family) {
        const sticker = state.birds.find((bird) => bird.sticker.family === family);
        return sticker ? sticker.sticker.familyEnglish : family;
      }

      els.chips.addEventListener("click", (event) => {
        const chip = event.target.closest(".chip");
        if (!chip) return;
        if (chip.dataset.kind === "order") {
          state.order = chip.dataset.value;
          state.family = null;
        } else {
          state.family = state.family === chip.dataset.value ? null : chip.dataset.value;
        }
        refresh();
      });

      els.breadcrumb.addEventListener("click", (event) => {
        const crumb = event.target.closest("[data-crumb]");
        if (!crumb) return;
        if (crumb.dataset.crumb === "all") state.order = null;
        state.family = null;
        refresh();
      });

      // ===== Layout =====

      // The words in the middle: the automatic ones, or what the user typed.
      function centerLines() {
        return centerText(autoCenterLines(), {
          who: els.who.value,
          what: els.what.value,
          where: els.where.value,
        });
      }

      // Show the automatic words as the placeholders, so a blank field says what it will print.
      function renderTextFields() {
        const auto = autoCenterLines();
        els.who.placeholder = auto.who;
        els.what.placeholder = auto.what;
        els.where.placeholder = auto.where || "No place";
      }

      function autoCenterLines() {
        // Who, how many, which group (with threatened / status), and where and
        // when (place, dates, months); evidence and quality stay off the image.
        const q = state.query;
        const count = filteredBirds().length;
        let group = "";
        if (state.family) group = familyLabel(state.family);
        else if (state.order) group = orderLabel(state.order);
        else if (q.taxonName) group = q.taxonName;
        // "threatened endemic lifers", or "threatened · Hawks & eagles" for a group.
        const status = [els.threatened.checked ? "threatened" : "", q.establishment].filter(Boolean).join(" ");
        const what = collageWhat({ group, status, lifers: lifersActive() });
        const where = [q.placeName, q.whenLabel, q.monthsLabel].filter(Boolean).join(" · ");
        return { who: `@${q.username}`, count: count.toLocaleString(), what, where };
      }

      // Font sizes and the box they need, in layout units.
      function measureCenter(lines, width, height) {
        const base = Math.min(width, height);
        const sizes = {
          who: base * 0.03,
          count: base * (lines.count.length > 3 ? 0.14 : 0.17),
          what: base * 0.036,
          where: base * 0.026,
        };
        const ctx = document.createElement("canvas").getContext("2d");
        const measure = (text, size, weight) => {
          ctx.font = `${weight} ${size}px ${FONT}`;
          return ctx.measureText(text).width;
        };
        // Long lines (many filters) get smaller rather than wider than this.
        const maxLine = Math.min(width * 0.7, base * 0.9);
        const weights = { who: 600, count: 800, what: 600, where: 500 };
        let textWidth = 0;
        const lineWidths = {};
        for (const key of Object.keys(sizes)) {
          if (!lines[key]) continue;
          let lineWidth = measure(lines[key], sizes[key], weights[key]);
          if (lineWidth > maxLine) {
            sizes[key] *= maxLine / lineWidth;
            lineWidth = maxLine;
          }
          lineWidths[key] = lineWidth;
          textWidth = Math.max(textWidth, lineWidth);
        }
        const textHeight =
          sizes.who * 1.3 + sizes.count * 1.0 + sizes.what * 1.4 + (lines.where ? sizes.where * 1.4 : 0);
        const w = Math.min(width * 0.8, textWidth + base * 0.025);
        const h = textHeight + base * 0.015;
        const box = { x: (width - w) / 2, y: (height - h) / 2, w, h };
        const baselines = textBaselines(lines, sizes, box);
        // A snug rectangle behind each line, kept free of birds whatever the hole's shape.
        const pad = base * 0.008;
        const lineBoxes = Object.keys(baselines).map((key) => {
          const top = key === "count" ? 0.76 : 0.82; // digits have no descenders
          const bottom = key === "count" ? 0.02 : 0.24;
          return {
            x: (width - lineWidths[key]) / 2 - pad,
            y: baselines[key] - sizes[key] * top - pad,
            w: lineWidths[key] + pad * 2,
            h: sizes[key] * (top + bottom) + pad * 2,
          };
        });
        return { sizes, box, baselines, lineBoxes };
      }

      // Where each line of the middle text sits (its baseline), centred in the box.
      function textBaselines(lines, sizes, box) {
        const used = sizes.who * 1.3 + sizes.count + sizes.what * 1.4 + (lines.where ? sizes.where * 1.4 : 0);
        const baselines = {};
        let y = box.y + (box.h - used) / 2 + sizes.who;
        baselines.who = y;
        y += sizes.who * 0.3 + sizes.count * 0.92;
        baselines.count = y;
        y += sizes.count * 0.08 + sizes.what * 1.25;
        baselines.what = y;
        if (lines.where) baselines.where = y + sizes.where * 1.45;
        return baselines;
      }

      function footerHeight(width, height) {
        return Math.min(width, height) * 0.045;
      }

      function currentFormat() {
        return FORMATS[els.format.value] || FORMATS.wide;
      }

      // The size options for the chosen format, labelled with their pixels.
      function updateSizeOptions() {
        const format = currentFormat();
        const chosen = Number(els.size.value || readPref("birdCollageSize", "2"));
        els.size.innerHTML = SIZE_SCALES.map((scale, i) => {
          const name = format.sizes[i] || (scale === 2 ? "Sharp" : "Max");
          return `<option value="${scale}">${format.width * scale}×${format.height * scale} · ${name}</option>`;
        }).join("");
        els.size.value = SIZE_SCALES.includes(chosen) ? chosen : 2;
      }

      function computeLayout() {
        const format = currentFormat();
        const width = LAYOUT_WIDTH;
        const height = Math.round((LAYOUT_WIDTH * format.height) / format.width);
        const birds = filteredBirds();
        const lines = centerLines();
        const center = measureCenter(lines, width, height);
        const footer = footerHeight(width, height);
        // A rounded hole that hugs the text (a superellipse, squarer than an oval),
        // so the birds come close around the count.
        const hole = { shape: "ellipse", power: 3, w: center.box.w * 1.02, h: center.box.h * 1.06 };
        hole.x = (width - hole.w) / 2;
        hole.y = (height - hole.h) / 2;
        const reserve = [hole, ...center.lineBoxes];
        if (format.safe) {
          // Keep the story's top and bottom clear; the credit goes in the bottom band.
          const band = height * format.safe;
          reserve.push({ x: 0, y: 0, w: width, h: band }, { x: 0, y: height - band, w: width, h: band });
        } else {
          reserve.push({ x: 0, y: height - footer, w: width, h: footer });
        }
        const key = [
          els.format.value,
          els.trueSize.checked,
          birds.map((bird) => bird.sticker.stem).join(","),
          center.box.w.toFixed(1),
          center.box.h.toFixed(1),
        ].join("|");
        if (state.layout && state.layout.key === key) {
          state.layout.lines = lines;
          state.layout.center = center;
          return state.layout;
        }
        const layoutBirds = birds.map((bird) => {
          const file = stickerFiles.get(bird.sticker.stem);
          return {
            key: bird.sticker.stem,
            massG: bird.sticker.massG,
            aspect: file.aspect,
            opaque: file.opaque,
            mask: file.mask,
          };
        });
        const { placements } = layoutCollage(layoutBirds, {
          width,
          height,
          trueSize: els.trueSize.checked,
          reserve,
          cols: birds.length > 400 ? 400 : 320,
        });
        const birdsByKey = new Map(birds.map((bird) => [bird.sticker.stem, bird]));
        state.layout = { key, width, height, placements, birdsByKey, lines, center };
        return state.layout;
      }

      // ===== Drawing =====

      function theme() {
        return els.dark.checked ? THEMES.dark : THEMES.light;
      }

      function drawText(ctx, layout, colors) {
        const { lines, center } = layout;
        const { sizes, baselines } = center;
        const cx = layout.width / 2;
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = colors.accent;
        ctx.font = `600 ${sizes.who}px ${FONT}`;
        ctx.fillText(lines.who, cx, baselines.who);
        ctx.fillStyle = colors.ink;
        ctx.font = `800 ${sizes.count}px ${FONT}`;
        ctx.fillText(lines.count, cx, baselines.count);
        ctx.font = `600 ${sizes.what}px ${FONT}`;
        ctx.fillText(lines.what, cx, baselines.what);
        if (lines.where) {
          ctx.fillStyle = colors.soft;
          ctx.font = `500 ${sizes.where}px ${FONT}`;
          ctx.fillText(lines.where, cx, baselines.where);
        }

        const footer = footerHeight(layout.width, layout.height);
        const credit = "Bird Collage · glauberramos.github.io/inat";
        const safe = currentFormat().safe;
        const margin = Math.min(layout.width, layout.height) * 0.025;
        ctx.fillStyle = colors.soft;
        if (safe) {
          // Story: centred at the top of the clear bottom band, above where
          // Instagram puts its reply box.
          const size = footer * 0.42;
          ctx.font = `500 ${size}px ${FONT}`;
          ctx.textAlign = "center";
          ctx.fillText(credit, layout.width / 2, layout.height * (1 - safe) + size * 1.8);
          return;
        }
        ctx.font = `500 ${footer * 0.36}px ${FONT}`;
        ctx.textAlign = "left";
        ctx.fillText(credit, margin, layout.height - footer * 0.4);
      }

      // Decode a sticker straight to the size it is drawn at: the full file is
      // ~1,000 px, so this keeps every sticker sharp without holding the
      // originals decoded in memory.
      async function decodeSticker(stem, pixelWidth, pixelHeight) {
        const blob = stickerFiles.get(stem).blob;
        try {
          return await createImageBitmap(blob, {
            resizeWidth: pixelWidth,
            resizeHeight: pixelHeight,
            resizeQuality: "high",
          });
        } catch {
          return createImageBitmap(blob);
        }
      }

      // Draw a layout onto a 2D context already scaled to layout units.
      // pixelScale: device pixels per layout unit, for decoding at the right size.
      // cache: a Map to keep decoded stickers in (on screen), or null (export).
      async function drawCollage(ctx, layout, pixelScale, { cache, progressive, isCurrent, onProgress }) {
        const colors = theme();
        ctx.fillStyle = colors.background;
        ctx.fillRect(0, 0, layout.width, layout.height);
        drawText(ctx, layout, colors);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        const placements = layout.placements;
        const batchSize = progressive ? 6 : 4;
        for (let i = 0; i < placements.length; i += batchSize) {
          const batch = placements.slice(i, i + batchSize);
          const bitmaps = await Promise.all(
            batch.map(async (p) => {
              const pw = Math.max(1, Math.round(p.w * pixelScale));
              const ph = Math.max(1, Math.round(p.h * pixelScale));
              const cacheKey = `${p.key}@${pw}x${ph}`;
              if (cache && cache.has(cacheKey)) return { bitmap: cache.get(cacheKey), cached: true };
              const bitmap = await decodeSticker(p.key, pw, ph);
              if (cache) cache.set(cacheKey, bitmap);
              return { bitmap, cached: !!cache };
            })
          );
          if (isCurrent && !isCurrent()) return false;
          batch.forEach((p, j) => {
            ctx.drawImage(bitmaps[j].bitmap, p.x, p.y, p.w, p.h);
            if (!bitmaps[j].cached) bitmaps[j].bitmap.close();
          });
          if (onProgress) onProgress(Math.min(i + batchSize, placements.length), placements.length);
          if (progressive) await new Promise((resolve) => requestAnimationFrame(resolve));
        }
        return true;
      }

      // Size the on-screen canvas: full width, but never taller than the window.
      // The preview's loading pill. dim: fade the old collage while a new one is worked out.
      function setPreviewLoading(text, { dim = false } = {}) {
        els.previewLoadingText.textContent = text;
        els.previewLoading.hidden = false;
        els.wrap.classList.toggle("is-dim", dim);
        els.download.disabled = true;
      }

      function clearPreviewLoading() {
        els.previewLoading.hidden = true;
        els.wrap.classList.remove("is-dim");
        els.download.disabled = false;
      }

      // Give the browser a frame to paint (the pill) before a long, blocking step.
      function nextPaint() {
        return new Promise((resolve) => requestAnimationFrame(() => setTimeout(resolve, 0)));
      }

      function sizeWrap(aspect) {
        const maxWidth = els.wrap.parentElement.clientWidth;
        const maxHeight = Math.max(320, window.innerHeight * 0.82);
        let cssWidth = maxWidth;
        let cssHeight = cssWidth / aspect;
        if (cssHeight > maxHeight) {
          cssHeight = maxHeight;
          cssWidth = cssHeight * aspect;
        }
        els.wrap.style.width = `${Math.round(cssWidth)}px`;
        els.wrap.style.height = `${Math.round(cssHeight)}px`;
        return { cssWidth, cssHeight };
      }

      function sizeCanvas(layout) {
        const { cssWidth, cssHeight } = sizeWrap(layout.width / layout.height);
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        els.canvas.width = Math.round(cssWidth * dpr);
        els.canvas.height = Math.round(cssHeight * dpr);
        return els.canvas.width / layout.width;
      }

      // The cache key of a sticker decoded at the size it is drawn on screen.
      function screenKey(p, pixelScale) {
        return `${p.key}@${Math.max(1, Math.round(p.w * pixelScale))}x${Math.max(1, Math.round(p.h * pixelScale))}`;
      }

      async function drawScreen() {
        resetHover();
        const token = ++state.renderToken;
        const layout = state.layout;
        const pixelScale = sizeCanvas(layout);
        const ctx = els.canvas.getContext("2d");
        ctx.setTransform(pixelScale, 0, 0, pixelScale, 0, 0);
        // Only animate stickers arriving the first time they're drawn at this size.
        const fresh = layout.placements.some((p) => !screenBitmaps.has(screenKey(p, pixelScale)));
        if (fresh) {
          // Drop stickers decoded at sizes this layout no longer uses.
          for (const bitmap of screenBitmaps.values()) bitmap.close();
          screenBitmaps = new Map();
        }
        if (fresh) setPreviewLoading(`Drawing birds… 0 / ${layout.placements.length}`);
        const done = await drawCollage(ctx, layout, pixelScale, {
          cache: screenBitmaps,
          progressive: fresh,
          isCurrent: () => token === state.renderToken,
          onProgress: fresh
            ? (count, total) => {
                if (token === state.renderToken) els.previewLoadingText.textContent = `Drawing birds… ${count} / ${total}`;
              }
            : null,
        });
        if (done && token === state.renderToken) clearPreviewLoading();
      }

      function renderNotes() {
        const parts = [];
        if (state.unmatched.length) {
          const list = state.unmatched
            .map(
              (bird) =>
                `<a href="https://www.inaturalist.org/taxa/${bird.taxonId}" target="_blank" rel="noopener">${escapeHtml(bird.common || bird.name)}</a> <em>(${escapeHtml(bird.name)})</em>`
            )
            .join(", ");
          parts.push(
            `<details><summary>${state.unmatched.length} of your species have no sticker yet and are left out</summary>${list}</details>`
          );
        }
        parts.push(
          `Stickers: <a href="https://github.com/alchaincyf/huashu-bird-sticker" target="_blank" rel="noopener">huashu-bird-sticker</a> (CC BY 4.0, AI illustrations) · ` +
            `Body mass: <a href="https://doi.org/10.1111/ele.13898" target="_blank" rel="noopener">AVONET</a> · ` +
            `Inspired by <a href="https://everybird.yusuftaleb.com/" target="_blank" rel="noopener">Everybird</a> by Yusuf Taleb`
        );
        els.notes.innerHTML = parts.map((p) => `<div>${p}</div>`).join("");
      }

      let layoutTimer = null;
      function refresh() {
        renderFilters();
        renderTextFields();
        renderNotes();
        els.tooltip.style.display = "none";
        clearTimeout(layoutTimer);
        const format = currentFormat();
        sizeWrap(format.width / format.height);
        const count = filteredBirds().length;
        setPreviewLoading(`Arranging ${plural(count, "bird", "birds")}…`, { dim: true });
        // Let the chips and the pill paint before a big layout runs.
        layoutTimer = setTimeout(async () => {
          await nextPaint();
          computeLayout();
          els.wrap.classList.remove("is-dim");
          drawScreen();
        }, 20);
      }

      // ===== Lifers =====

      // Lifers need a start: with all time (or only an end date) every bird is one.
      function syncLifersToggle() {
        const start = state.query && state.query.liferStart;
        els.lifers.disabled = !start;
        if (!start) els.lifers.checked = false;
        els.lifersLabel.title = start
          ? `Only the birds you saw for the first time in this period (none of your observations before ${formatDay(start)})`
          : "Pick a period (dates, a year or recent days) to see only the birds that were new to you in it";
      }

      // Every bird the user saw before the period, anywhere, as sticker stems
      // (so lumps and older names line up with the collage). Once per collage.
      async function loadPrior(q) {
        const url = `${API_BASE}/observations/species_counts?${priorQueryParams(q.username, q.liferStart, q.wild)}`;
        const results = await fetchSpeciesCountPages(url, {
          perPage: 500,
          delayMs: 1000,
          onPage: (page, pages) => {
            if (pages > 1) els.previewLoadingText.textContent = `Checking the birds you'd seen before… page ${page} of ${pages}`;
          },
        });
        const stems = new Set();
        for (const result of results) {
          const sticker = result.taxon && matchSticker(STICKER_INDEX, result.taxon.name);
          if (sticker) stems.add(sticker.stem);
        }
        q.prior = stems;
      }

      async function applyLifers() {
        const q = state.query;
        if (q && els.lifers.checked && !q.prior) {
          els.lifers.disabled = true;
          setPreviewLoading("Checking the birds you'd seen before…", { dim: true });
          try {
            await loadPrior(q);
          } catch (error) {
            if (state.query === q) {
              els.lifers.checked = false;
              setError(`Couldn't check your earlier birds: ${error.message}`);
            }
          }
          if (state.query !== q) return; // a new collage was made meanwhile
          syncLifersToggle();
        }
        refresh();
      }

      // ===== Hover & click =====

      function birdAt(event) {
        const layout = state.layout;
        if (!layout) return null;
        const rect = els.canvas.getBoundingClientRect();
        const x = ((event.clientX - rect.left) / rect.width) * layout.width;
        const y = ((event.clientY - rect.top) / rect.height) * layout.height;
        for (let i = layout.placements.length - 1; i >= 0; i--) {
          const p = layout.placements[i];
          if (x < p.x || y < p.y || x > p.x + p.w || y > p.y + p.h) continue;
          const mask = stickerFiles.get(p.key).mask;
          const mx = Math.min(mask.width - 1, Math.floor(((x - p.x) / p.w) * mask.width));
          const my = Math.min(mask.height - 1, Math.floor(((y - p.y) / p.h) * mask.height));
          if (mask.data[my * mask.width + mx]) return layout.birdsByKey.get(p.key);
        }
        return null;
      }

      // ===== Hover animation =====

      // The hovered bird grows where it is, on the collage itself: each frame
      // repaints the collage from the stickers already decoded for the screen,
      // with the hovered one last, a little bigger.
      const HOVER_GROWTH = 1.15;
      const HOVER_MS = 160;
      const hover = { key: null, scale: 1, from: 1, to: 1, start: 0, frame: 0, bitmap: null };

      function easeOut(t) {
        return 1 - (1 - t) ** 3;
      }

      function paintHoverFrame() {
        const layout = state.layout;
        if (!layout) return;
        const pixelScale = els.canvas.width / layout.width;
        const ctx = els.canvas.getContext("2d");
        ctx.setTransform(pixelScale, 0, 0, pixelScale, 0, 0);
        const colors = theme();
        ctx.fillStyle = colors.background;
        ctx.fillRect(0, 0, layout.width, layout.height);
        drawText(ctx, layout, colors);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        let hovered = null;
        for (const p of layout.placements) {
          if (p.key === hover.key) {
            hovered = p;
            continue;
          }
          const bitmap = screenBitmaps.get(screenKey(p, pixelScale));
          if (bitmap) ctx.drawImage(bitmap, p.x, p.y, p.w, p.h);
        }
        if (!hovered) return;
        const w = hovered.w * hover.scale;
        const h = hovered.h * hover.scale;
        const bitmap = hover.bitmap || screenBitmaps.get(screenKey(hovered, pixelScale));
        if (!bitmap) return;
        const lift = (hover.scale - 1) / (HOVER_GROWTH - 1); // 0..1
        ctx.save();
        // Shadow sizes are in device pixels, not layout units.
        ctx.shadowColor = `rgba(0, 0, 0, ${0.22 * lift})`;
        ctx.shadowBlur = 10 * lift * (window.devicePixelRatio || 1);
        ctx.shadowOffsetY = 4 * lift * (window.devicePixelRatio || 1);
        ctx.drawImage(bitmap, hovered.x - (w - hovered.w) / 2, hovered.y - (h - hovered.h) / 2, w, h);
        ctx.restore();
      }

      // Ease the hovered bird's scale towards `to`, repainting every frame.
      function animateHover(to) {
        hover.from = hover.scale;
        hover.to = to;
        hover.start = performance.now();
        cancelAnimationFrame(hover.frame);
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const step = (now) => {
          const t = reduce ? 1 : Math.min(1, (now - hover.start) / HOVER_MS);
          hover.scale = hover.from + (hover.to - hover.from) * easeOut(t);
          paintHoverFrame();
          if (t < 1) {
            hover.frame = requestAnimationFrame(step);
          } else if (hover.to === 1) {
            hover.key = null;
            hover.bitmap = null;
          }
        };
        hover.frame = requestAnimationFrame(step);
      }

      // A sharper copy of the hovered sticker, decoded at its grown size.
      async function loadHoverBitmap(placement) {
        const pixelScale = els.canvas.width / state.layout.width;
        const bitmap = await decodeSticker(
          placement.key,
          Math.max(1, Math.round(placement.w * pixelScale * HOVER_GROWTH)),
          Math.max(1, Math.round(placement.h * pixelScale * HOVER_GROWTH))
        );
        if (hover.key !== placement.key) {
          bitmap.close();
          return;
        }
        if (hover.bitmap) hover.bitmap.close();
        hover.bitmap = bitmap;
        paintHoverFrame();
      }

      function showHover(placement) {
        if (hover.key === placement.key && hover.to === HOVER_GROWTH) return;
        if (hover.key !== placement.key) {
          // The last bird snaps back; the new one grows from its own size.
          if (hover.bitmap) hover.bitmap.close();
          hover.bitmap = null;
          hover.key = placement.key;
          hover.scale = 1;
          loadHoverBitmap(placement);
        }
        animateHover(HOVER_GROWTH);
      }

      function hideHover() {
        if (hover.key && hover.to !== 1) animateHover(1);
      }

      // Forget the hover without painting (a new collage is about to be drawn).
      function resetHover() {
        cancelAnimationFrame(hover.frame);
        if (hover.bitmap) hover.bitmap.close();
        Object.assign(hover, { key: null, scale: 1, from: 1, to: 1, bitmap: null });
      }

      els.canvas.addEventListener("mousemove", (event) => {
        const bird = birdAt(event);
        els.canvas.style.cursor = bird ? "pointer" : "default";
        if (!bird) {
          els.tooltip.style.display = "none";
          hideHover();
          return;
        }
        // Not while a new collage is being arranged or drawn.
        if (els.previewLoading.hidden) {
          const placement = state.layout.placements.find((p) => p.key === bird.sticker.stem);
          if (placement) showHover(placement);
        }
        const status = THREATENED_IUCN.includes(bird.sticker.iucn) ? ` · ${bird.sticker.iucn}` : "";
        els.tooltip.innerHTML =
          `<strong>${escapeHtml(bird.common || bird.name)}</strong><br>` +
          `<em>${escapeHtml(bird.name)}</em><br>` +
          `${escapeHtml(bird.sticker.familyEnglish)}${status}<br>` +
          `${plural(bird.observations, "observation", "observations")} by you · ${bird.globalObservations.toLocaleString()} on iNaturalist`;
        const wrapRect = els.wrap.getBoundingClientRect();
        let left = event.clientX - wrapRect.left + 14;
        let top = event.clientY - wrapRect.top + 14;
        els.tooltip.style.display = "block";
        if (left + els.tooltip.offsetWidth > wrapRect.width) left -= els.tooltip.offsetWidth + 28;
        if (top + els.tooltip.offsetHeight > wrapRect.height) top -= els.tooltip.offsetHeight + 28;
        els.tooltip.style.left = `${left}px`;
        els.tooltip.style.top = `${top}px`;
      });

      els.canvas.addEventListener("mouseleave", () => {
        els.tooltip.style.display = "none";
        hideHover();
      });

      els.canvas.addEventListener("click", (event) => {
        const bird = birdAt(event);
        if (!bird || !state.query) return;
        window.open(
          `https://www.inaturalist.org/observations?user_id=${encodeURIComponent(state.query.username)}&taxon_id=${bird.taxonId}`,
          "_blank",
          "noopener"
        );
      });

      // ===== Download =====

      async function downloadPng() {
        const layout = state.layout;
        if (!layout || !layout.placements.length) return;
        const format = currentFormat();
        const scale = Number(els.size.value) || 2;
        const canvas = document.createElement("canvas");
        canvas.width = format.width * scale;
        canvas.height = format.height * scale;
        const pixelScale = canvas.width / layout.width;
        const ctx = canvas.getContext("2d");
        ctx.setTransform(pixelScale, 0, 0, canvas.height / layout.height, 0, 0);
        const label = els.download.textContent;
        els.download.disabled = true;
        try {
          await drawCollage(ctx, layout, pixelScale, {
            cache: null,
            progressive: false,
            onProgress: (done, total) => {
              els.download.textContent = `Preparing… ${done}/${total}`;
            },
          });
          els.download.textContent = "Saving…";
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
          const parts = [
            "bird-collage",
            state.query.username,
            state.query.whenLabel,
            state.query.monthsLabel,
            lifersActive() ? "lifers" : "",
            state.order,
            state.family,
          ]
            .filter(Boolean)
            .map((part) =>
              String(part)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-|-$/g, "")
            );
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `${parts.join("-")}-${format.name}-${canvas.width}x${canvas.height}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(link.href), 10000);
        } catch (error) {
          setError(`Couldn't make the image: ${error.message}`);
        } finally {
          els.download.disabled = false;
          els.download.textContent = label;
        }
      }

      // ===== Wiring =====

      els.form.addEventListener("submit", (event) => {
        event.preventDefault();
        loadBirds();
      });
      els.download.addEventListener("click", downloadPng);
      els.trueSize.addEventListener("change", () => {
        writePref("birdCollageTrueSize", els.trueSize.checked);
        refresh();
      });
      els.threatened.addEventListener("change", refresh);
      els.lifers.addEventListener("change", () => {
        setError("");
        applyLifers();
      });
      els.format.addEventListener("change", () => {
        writePref("birdCollageFormat", els.format.value);
        updateSizeOptions();
        refresh();
      });
      els.size.addEventListener("change", () => writePref("birdCollageSize", els.size.value));
      // Retype the middle: wait for a pause, since a longer line can move the birds.
      let textTimer = null;
      for (const input of [els.who, els.what, els.where]) {
        input.addEventListener("input", () => {
          clearTimeout(textTimer);
          textTimer = setTimeout(() => {
            writePref("birdCollageName", els.who.value);
            if (state.query) refresh();
          }, 350);
        });
      }
      els.dark.addEventListener("change", () => {
        writePref("birdCollageDark", els.dark.checked);
        if (state.layout) drawScreen();
      });

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (state.layout && els.panel.style.display !== "none") drawScreen();
        }, 200);
      });

      els.trueSize.checked = readPref("birdCollageTrueSize", "false") === "true";
      els.dark.checked = readPref("birdCollageDark", "false") === "true";
      els.who.value = readPref("birdCollageName", "");
      const savedFormat = readPref("birdCollageFormat", "wide");
      if (FORMATS[savedFormat]) els.format.value = savedFormat;
      updateSizeOptions();

      // ?user= and saved values only prefill the form; nothing loads until asked.
      initUsername(els.username);
      initLanguage(els.language);
      initUsernameAutocomplete(els.username, els.usernameList);
      initLocationAutocomplete(els.place, els.placeList, els.placeId, {
        persistToStorage: true,
        loadFromStorage: true,
        loadFromUrl: true,
        updateUrlOnSelect: true,
        includeProjects: true,
        projectIdInput: els.projectId,
      });
      createAutocomplete({
        inputElement: els.taxon,
        containerElement: els.taxonList,
        fetchUrl: (query) => `${API_BASE}/taxa/autocomplete?q=${encodeURIComponent(query)}&taxon_id=3&per_page=10`,
        formatResult: (taxon) => `
          <div class="autocomplete-item">
            <div class="autocomplete-name">${escapeHtml(taxon.preferred_common_name || taxon.name)}</div>
            <div class="autocomplete-login">${escapeHtml(taxon.rank)} · <em>${escapeHtml(taxon.name)}</em></div>
          </div>`,
        onSelect: (taxon) => {
          els.taxon.value = taxon.preferred_common_name || taxon.name;
          els.taxonId.value = taxon.id;
        },
        onClear: () => {
          els.taxonId.value = "";
        },
      });
      els.taxon.addEventListener("input", () => {
        els.taxonId.value = "";
      });
      document.addEventListener("click", (event) => {
        for (const [input, list] of [
          [els.username, els.usernameList],
          [els.taxon, els.taxonList],
        ]) {
          if (!input.contains(event.target) && !list.contains(event.target)) list.style.display = "none";
        }
      });
    </script>
    <button class="feedback-button" id="feedbackBtn">Send feedback</button>
    <script defer data-domain="glauberramos.github.io/inat" src="https://plausible.io/js/script.js"></script>
    <script>
      initFeedbackButton();
    </script>
    <script src="dark-mode.js?v=2"></script>
    <script>
      registerServiceWorker();
    </script>
  </body>
</html>
