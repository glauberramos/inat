<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sticker Collage - iNaturalist Tools</title>
    <!-- Bird Collage is now Sticker Collage. GitHub Pages can't send a 301, so this
         page redirects at once (search engines treat an instant refresh as a permanent
         redirect) and keeps ?user=... and the hash. -->
    <link rel="canonical" href="https://glauberramos.github.io/inat/sticker-collage" />
    <script>
      location.replace(
        (location.protocol === "file:" ? "sticker-collage.html" : "sticker-collage") + location.search + location.hash
      );
    </script>
    <meta http-equiv="refresh" content="0; url=sticker-collage" />
  </head>
  <body>
    <p>Bird Collage is now <a href="sticker-collage">Sticker Collage</a>.</p>
  </body>
</html>
